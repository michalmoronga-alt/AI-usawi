[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,0
OnRefreshAction=[!KeepOnScreen 0][!AutoSelectScreen 1][!Draggable 0]
MouseLeaveAction=[!Draggable 0]
ContextTitle=Mierka 100 %
ContextAction=[!CommandMeasure Runtime "SetScale(1)"]
ContextTitle2=Mierka 150 %
ContextAction2=[!CommandMeasure Runtime "SetScale(1.5)"]

[Metadata]
Name=NOXUN AI Usage
Author=AI-usawi
Information=Explicit LIVE or offline DEMO. Weekly consumed usage.
Version=0.2.0-live

@Include=#@#Settings.inc
@Include2=#@#State\Mode.inc

[Collector]
Measure=Plugin
Plugin=RunCommand
Program="%WINDIR%\System32\WindowsPowerShell\v1.0\powershell.exe"
Parameter=-NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -File "#@#Adapter\Collect.ps1" -IntervalSeconds #RefreshSeconds# -TimeoutSeconds #TimeoutSeconds#
State=Hide
OutputType=UTF8
Timeout=85000
FinishAction=[!CommandMeasure Runtime "CollectionFinished()"]
DynamicVariables=1
UpdateDivider=-1

[Runtime]
Measure=Script
ScriptFile=#@#Runtime.lua
DynamicVariables=1

[TextStyle]
FontFace=#FontFace#
FontColor=#TextColor#
AntiAlias=1
ClipString=2
DynamicVariables=1
MouseActionCursor=0

[ActionStyle]
MouseActionCursor=1
MouseOverAction=[!Draggable 0]
SolidColor=0,0,0,1

[RoundStyle]
StartAngle=4.71238898038469
RotationAngle=6.28318530717959
Solid=1
AntiAlias=1
DynamicVariables=1
MouseActionCursor=0

[Bounds]
Meter=Image
W=376
H=236
SolidColor=0,0,0,0
DynamicVariables=1

[Drag]
Meter=String
MeterStyle=TextStyle
Text=DEMO
MouseOverAction=[!Draggable 1]
MouseLeaveAction=[!Draggable 0]
MouseActionCursor=1
MouseActionCursorName=SIZE_ALL
SolidColor=0,0,0,1

[ScaleButton]
Meter=String
MeterStyle=TextStyle | ActionStyle
Text=
LeftMouseUpAction=[!CommandMeasure Runtime "ToggleScale()"]

[codexHit]
Meter=Shape
Shape=Ellipse 70,70,70 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure Runtime "Toggle('codex')"]
MouseOverAction=[!Draggable 0]
DynamicVariables=1
MouseActionCursor=1

[codexWeeklyValue]
